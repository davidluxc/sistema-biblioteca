{% extends 'base.html' %}{% block heading %}{{ 'Editar livro' if book else 'Cadastrar livro' }}{% endblock %}{% block content %}<section class="panel form-panel"><h2>Dados do livro</h2><form method="post" class="form-grid"><div class="field wide"><label>Título *</label><input name="title" required value="{{ book.title if book else '' }}"></div><div class="field"><label>Autor *</label><input name="author" required value="{{ book.author if book else '' }}"></div><div class="field"><label>ISBN</label><input name="isbn" value="{{ book.isbn if book else '' }}"></div><div class="field"><label>Categoria</label><input name="category" value="{{ book.category if book else '' }}" placeholder="Romance, ciência..."></div><div class="field"><label>Ano</label><input name="year" type="number" min="0" max="2100" value="{{ book.year if book and book.year else '' }}"></div><div class="field"><label>Quantidade de exemplares *</label><input name="copies" type="number" min="1" required value="{{ book.copies if book else 1 }}"></div><div class="form-actions wide"><button class="btn primary">Salvar livro</button><a class="btn light" href="{{ url_for('books') }}">Cancelar</a></div></form></section>{% endblock %}
