{% extends 'base.html' %}{% block heading %}Novo empréstimo{% endblock %}{% block content %}<section class="panel form-panel"><h2>Registrar empréstimo</h2><p class="muted">O prazo padrão de devolução é de 14 dias.</p><form method="post" class="form-grid"><div class="field wide"><label>Leitor *</label><select name="user_id" required><option value="">Selecione um leitor</option>{% for user in users %}<option value="{{ user.id }}">{{ user.name }} — {{ user.registration }}</option>{% endfor %}</select></div><div class="field wide"><label>Livro disponível *</label><select name="book_id" required><option value="">Selecione um livro</option>{% for book in books %}<option value="{{ book.id }}" {% if book.available<1 %}disabled{% endif %}>{{ book.title }} — {{ book.author }} ({{ book.available }} disponível(is))</option>{% endfor %}</select></div><div class="form-actions wide"><button class="btn primary">Confirmar empréstimo</button><a class="btn light" href="{{ url_for('loans') }}">Cancelar</a></div></form></section>{% endblock %}
