{% extends 'base.html' %}{% block heading %}Cadastrar usuário{% endblock %}{% block content %}<section class="panel form-panel"><h2>Dados do usuário</h2><form method="post" class="form-grid"><div class="field wide"><label>Nome completo *</label><input name="name" required></div><div class="field"><label>Matrícula / usuário *</label><input name="registration" required></div><div class="field"><label>E-mail</label><input name="email" type="email"></div><div class="field"><label>Senha inicial (mínimo 6 caracteres) *</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Perfil</label><select name="role"><option value="reader">Leitor</option><option value="admin">Administrador</option></select></div><div class="form-actions wide"><button class="btn primary">Cadastrar usuário</button><a class="btn light" href="{{ url_for('users') }}">Cancelar</a></div></form></section>{% endblock %}
